    body { margin: 0; background: #101010; color: #f0efeb; font: 16px/1.4 sans-serif; }

<body>
  <!--
    Isolierter Harness fuer den Stop-Assert der Section-Einfahrt.
    Hier laeuft NUR src/section-entrance.js — jeder rAF-Call auf dieser Seite
    stammt damit aus dem Einfahrts-Modul. Auf /work/tattoos haelt zusaetzlich
    V3.1 horizontal-drift einen eigenen Loop, ein globaler Zaehler ist dort
    nicht zurechenbar.
  -->
  <div class="spacer"></div>
  <section id="probe" data-section-entrance>Probe-Section</section>
  <div class="spacer"></div>
  <script type="module">
    import { initSectionEntrance } from '/src/section-entrance.js';
    window.__dispose = initSectionEntrance(document);
    window.__ready = true;
  </script>
</body>
