<!doctype html>
<html lang="en" data-page="home" data-hero-loading="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#242424" />
    <style data-hero-poster-critical>
      html, body { margin: 0; background: #242424; color: #f0efeb; font-family: Arial, Helvetica, sans-serif; }
      .skip-link, .floating-brand, .global-index { position: fixed; z-index: 10; }
      .skip-link { left: 22px; top: 15px; transform: translateY(-160%); }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .hero { position: relative; min-height: 540px; height: 100svh; overflow: hidden; }
      .hero > .stage { position: absolute; inset: 0; }
      .hero .fallback { position: absolute; inset: 0; background: var(--hero-poster-image) center / 67% auto no-repeat; opacity: 1; pointer-events: none; transition: opacity var(--hero-poster-fade) ease; }
      .hero #logo-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; opacity: 0; transition: opacity var(--hero-poster-fade) ease; }
      .hero .stage.is-ready #logo-canvas { opacity: 1; }
      .hero .stage.is-ready .fallback { opacity: 0; }
      .hero .stage.is-boot-failed #logo-canvas, .hero .stage.is-fallback #logo-canvas { display: none; }
      .hero .stage.is-boot-failed .fallback, .hero .stage.is-boot-slow .fallback { opacity: 1; }
      html[data-hero-loading='true'] .hero .stage:not(.is-ready):not(.is-poster-static):not(.is-boot-failed) .fallback {
        animation: hero-poster-breathe 2.8s ease-in-out infinite;
        will-change: transform, opacity;
      }
      @keyframes hero-poster-breathe {
        0%, 100% { opacity: .8; transform: scale(.996); }
        50% { opacity: 1; transform: scale(1.004); }
      }
      @media (prefers-reduced-motion: reduce) {
        html[data-hero-loading='true'] .hero .stage .fallback { animation: none; will-change: auto; }
      }
      html:not([data-h4-styles-ready]) .hero > :not(.stage) { visibility: hidden; }
      :root { --hero-poster-image: url("__H4_HERO_POSTER_URL__"); --hero-poster-fade: __H4_HERO_POSTER_FADE_MS__ms; }
    </style>
    <!--seo:start-->
    <meta name="description" content="h4ngelic — independent tattooing, jewellery and painting. berlin, de." />
    <title>h4ngelic</title>
    <!--seo:end-->
    <link rel="preload" href="/assets/wordmark-fallback.svg" as="image" fetchpriority="high" data-hero-poster-preload />
    <link rel="icon" href="/assets/h4ngelic-favicon-normal-r09-16.png" type="image/png" sizes="16x16" data-mode-icon="16" />
    <link rel="icon" href="/assets/h4ngelic-favicon-normal-r09-32.png" type="image/png" sizes="32x32" data-mode-icon="32" />
    <link rel="icon" href="/assets/h4ngelic-cursor.svg" type="image/svg+xml" sizes="any" data-mode-icon="svg" />
    <template id="hero-preloads">
      <link rel="modulepreload" href="/src/main.js" data-hero-preload="module" />
      <link rel="preload" href="/fonts/wordmark.typeface.json" as="fetch" type="application/json" crossorigin data-hero-preload="font" />
      <link rel="preload" href="__H4_HERO_ARTWORK_DESKTOP__" as="image" media="(min-width: 601px)" fetchpriority="high" data-hero-preload="artwork-desktop" />
      <link rel="preload" href="__H4_HERO_ARTWORK_MOBILE__" as="image" media="(max-width: 600px)" fetchpriority="high" data-hero-preload="artwork-mobile" />
    </template>
    <script type="speculationrules">
      {"prefetch":[
        {"source":"document","where":{"href_matches":"/about"},"eagerness":"moderate"},
        {"source":"document","where":{"href_matches":"/work/*"},"eagerness":"moderate"}
      ]}
    </script>
  </head>
  <body>
    <div class="page-composition" data-page-composition>
    <a class="skip-link" href="#page-content">skip to content</a>
    <!--floating:start--><header class="site-chrome" data-site-chrome><a class="floating-brand" data-floating-brand data-no-ink data-corruption-protected href="/">h4ngelic</a>
    <details class="global-index" data-global-index data-no-ink data-corruption-protected>
      <summary aria-label="open index" aria-controls="global-index-links"><span class="index-sign" aria-hidden="true">+</span></summary>
      <nav class="global-index-links" id="global-index-links" aria-label="Index">
        <a href="/" data-index-page="home"><span class="index-number" aria-hidden="true">00 /</span> home</a>
        <span class="index-static" data-index-page="creative"><span class="index-number" aria-hidden="true">01 /</span> creative</span>
        <a href="/about" data-index-page="about"><span class="index-number" aria-hidden="true">02 /</span> about</a>
        <a href="/#contact" data-index-page="contact"><span class="index-number" aria-hidden="true">03 /</span> contact</a>
      </nav>
    </details></header><!--floating:end-->
    <main>
      <!--hero:start-->
      <section class="hero" id="home-hero" aria-labelledby="page-title">
        <header class="masthead">
          <h1 id="page-title" class="sr-only">h4ngelic</h1>

        </header>
        <p class="returning-visitor-line" data-returning-visitor hidden>you know your way around here.</p>
        <div class="stage" id="stage">
          <div id="fallback" class="fallback" data-hero-poster role="img" aria-label="h4ngelic wordmark"></div>
          <canvas id="logo-canvas" aria-label="Interactive chrome h4ngelic wordmark. Drag to move and spin it. Scroll normally to move the page."></canvas>
        </div>
        <div class="hero-bottom">
          <p id="interaction-hint" class="sr-only">Move to push. Grab to spin.</p>
        </div>
        <div class="controls" data-controls role="group" aria-label="Wordmark animation and sound">
          <button id="speed-control" type="button" aria-pressed="false">Slow</button>
          <button id="pause-control" type="button" aria-pressed="false">Pause</button>
          <button class="mode-mute" type="button" data-mode-mute aria-label="mute transition sounds" aria-pressed="false">sound on</button>
        </div>
        <nav class="hero-nav" aria-label="Portfolio">
          <a href="/work">work <i class="arrow" aria-hidden="true"></i></a>
          <a href="/about">about <i class="arrow" aria-hidden="true"></i></a>
          <a href="/#contact">contact <i class="arrow" aria-hidden="true"></i></a>
        </nav>
        <p id="scene-status" class="sr-only" role="status" aria-live="polite">Loading the 3D wordmark.</p>
      </section>
      <!--hero:end-->
      <!--content:start--><div id="page-content" tabindex="-1"></div><!--content:end-->
    </main>
    <!--naavi:start--><a class="chapter-counter naavi" data-naavi data-chapter-counter data-no-ink data-corruption-protected href="/#selected-work" aria-label="NAAVI: 00 / 04, home. go to works" data-chapter="0" data-chapter-total="4"><span class="chapter-digit-window" aria-hidden="true"><span class="chapter-digit">00</span></span><span class="chapter-total" aria-hidden="true"> / 04</span></a><!--naavi:end-->
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
