<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#303033" />
    <meta name="description" content="h4ngelic — an interactive chrome wordmark. Grab, push and spin." />
    <title>h4ngelic</title>
    <link rel="icon" href="/assets/h4ngelic-cursor.svg" type="image/svg+xml" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <header class="masthead">
          <h1 id="page-title">h4ngelic © 2026</h1>
          <span class="edition">berlin, de</span>
        </header>
        <div class="stage" id="stage">
          <div id="fallback" class="fallback" role="img" aria-label="h4ngelic wordmark">h4ngelic</div>
          <canvas id="logo-canvas" aria-label="Interactive chrome h4ngelic wordmark. Drag to move and spin it. Scroll normally to move the page."></canvas>
        </div>
        <div class="hero-bottom">
          <p class="identity">independent<br />tattoo &amp; art</p>
          <p id="interaction-hint" class="sr-only">Move to push. Grab to spin.</p>
          <div class="controls" data-controls role="group" aria-label="Wordmark animation">
            <button id="reveal-control" type="button" aria-pressed="true">Reveal on</button>
            <button id="speed-control" type="button" aria-pressed="false">Slow</button>
            <button id="pause-control" type="button" aria-pressed="false">Pause</button>
          </div>
        </div>
        <nav aria-label="Portfolio">
          <span aria-label="Work — coming soon" title="Work — coming soon">work <i class="arrow" aria-hidden="true"></i></span>
          <span aria-label="About — coming soon" title="About — coming soon">about <i class="arrow" aria-hidden="true"></i></span>
          <span aria-label="Contact — coming soon" title="Contact — coming soon">contact <i class="arrow" aria-hidden="true"></i></span>
        </nav>
        <p id="scene-status" class="sr-only" role="status" aria-live="polite">Loading the 3D wordmark.</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
